<!DOCTYPE HTML>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
        <meta charset="UTF-8">
        <title>Happy 1 week!</title>
        <link rel="stylesheet" type="text/css" href="./css/format.css">
    </head>

    <body style="margin:0px">
        <canvas id="canvas"></canvas>

        <div id="imgTxt">
            <img id="img" src="pic/your_photo.png"> 
            <video id="clip" playsinline>
                <source src="pic/your_video.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <div id="content">
            <h2 id="together">We have known each other for</h2>
            <div id="timer">
                <b id="d"></b> Days 
                <b id="h"></b> Hours
                <b id="m"></b> Minutes
                <b id="s"></b> Seconds
            </div>
        </div>

        <div id="typeDiv">
            <span id="txt1"></span> <br />
            <span id="txt2"></span>
        </div>      

        <div id="heartTxt">
            <span id="clickMe">Click!</span>
            <div id="heart">
                <button id="button" onclick="startEverything()"></button>
            </div>
        </div>

        <script>
            // Compatibility variables for external JS files
            var ok = 0;
            var flag = 1;
            var t = 0;
            var playCount = 0;
            var imageArray = ["pic/your_photo.png"]; 
            var txtArray = ["You are soooo cute !!!!"];
            var imageIndex = 0;
            var len = 1;

            // The main click function
            function startEverything() {
                var video = document.getElementById("clip");
                var clickText = document.getElementById("clickMe");

                // 1. Play Video (Sound is allowed because of the click)
                if (video) {
                    video.play().catch(function(error) {
                        console.log("Video play failed: ", error);
                    });
                }
                
                // 2. Trigger Typewriter/Stars (calls function inside playImg.js)
                if (typeof window.play === "function") { 
                    window.play(); 
                }
                
                // 3. Hide the hint text
                if (clickText) {
                    clickText.style.opacity = "0";
                }
            }

            // Loop the video exactly 3 times
            document.getElementById("clip").onended = function() {
                playCount++;
                if (playCount < 3) {
                    this.play();
                }
            };
        </script>
        
        <script type="text/javascript" src="./js/stars.js"></script>
        <script type="text/javascript" src="./js/typeWriter.js"></script>
        <script type="text/javascript" src="./js/date.js"></script>
        <script type="text/javascript" src="./js/playImg.js"></script>
    </body>
</html>
