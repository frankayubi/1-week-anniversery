<!DOCTYPE HTML>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
        <meta charset="UTF-8">
        <title>Happy 1 week!</title>
        <link rel="stylesheet" type="text/css" href="./css/format.css">
    </head>

    <body style="margin:0px">
        <canvas></canvas>

        <div id="imgTxt">
            <img id="img" src="pic/socute.jpg"> 
            
            <video id="clip" playsinline>
                <source src="pic/speed.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <div id="content">
            <h2 id="together">We have known each other for</h2>
            <div id="timer">
                <b id="d"></b> Days 
                <b id="h"></b> Hours
                <b id="m"></b> Minutes
                <b id="s"></b> Seconds
            </div>
        </div>

        <div id="typeDiv">
            <span id="txt1"></span> <br />
            <span id="txt2"></span>
        </div>      

        <div id="heartTxt">
            <span id="clickMe">Click!</span>
            <div id="heart">
                <button id="button" onclick="startEverything()"></button>
            </div>
        </div>

        <script>
            var ok = 0;
            var flag = 1;
            var t = 0;
            var playCount = 0;

            // Compatibility for other scripts
            var imageArray = ["pic/socute.jpg"]; 
            var txtArray = ["You are soooo cute !!!!"];
            var imageIndex = 0;
            var len = 1;

            var video = document.getElementById("clip");

            // Function to trigger when heart is clicked
            function startEverything() {
                // Run the original play() function from playImg.js if it exists
                if (typeof play === "function") { 
                    play(); 
                }
                
                // Start the video with sound
                video.play();
            }

            // Logic to play exactly 3 times
            video.onended = function() {
                playCount++;
                if (playCount < 3) {
                    video.play();
                } else {
                    console.log("Video stopped after 3 plays.");
                }
            };
        </script>
        
        <script type="text/javascript" src="./js/stars.js"></script>
        <script type="text/javascript" src="./js/typeWriter.js"></script>
        <script type="text/javascript" src="./js/date.js"></script>
        <script type="text/javascript" src="./js/playImg.js"></script>
    </body>
</html>
